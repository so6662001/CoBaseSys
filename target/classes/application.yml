server:
  port: 8080
  tomcat:
    threads:
      max: 200
    max-connections: 20000
    accept-count: 500

spring:
  application:
    name: cobasesys
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/cobasesys
    username: cobasesys
    password: cobasesys123
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000
      pool-name: CoBaseSys-HikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=300s

  mail:
    host: smtp.example.com
    port: 587
    username: noreply@example.com
    password: changeme
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cobasesys:
  auth:
    timestamp-tolerance-seconds: 300
    nonce-expire-seconds: 300
    admin-token: changeme-admin-token
  webhook:
    max-retry: 3
    retry-interval-seconds: 30
    timeout-seconds: 10
  notification:
    low-balance-threshold: 1000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cobasesys: DEBUG
    org.hibernate.SQL: DEBUG
