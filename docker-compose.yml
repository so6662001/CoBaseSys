version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cobasesys-postgres
    environment:
      POSTGRES_DB: cobasesys
      POSTGRES_USER: cobasesys
      POSTGRES_PASSWORD: cobasesys123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=500
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c work_mem=16MB

  redis:
    image: redis:7-alpine
    container_name: cobasesys-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobasesys-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cobasesys
      SPRING_DATASOURCE_USERNAME: cobasesys
      SPRING_DATASOURCE_PASSWORD: cobasesys123
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
