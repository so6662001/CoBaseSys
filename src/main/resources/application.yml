server:
  port: 8080
  tomcat:
    threads:
      max: 200
    max-connections: 20000
    accept-count: 500

spring:
  application:
    name: cobasesys
  threads:
    virtual:
      enabled: true

  datasource:
    primary:
      url: jdbc:postgresql://localhost:5432/cobasesys
      username: cobasesys
      password: cobasesys123
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 100
        minimum-idle: 20
        pool-name: PrimaryHikariCP
    billing:
      url: jdbc:mysql://localhost:3306/cobasesys_billing?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: cobasesys
      password: cobasesys123
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 100
        minimum-idle: 20
        pool-name: BillingHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=300s

  mail:
    host: smtp.example.com
    port: 587
    username: noreply@example.com
    password: changeme
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cobasesys:
  auth:
    timestamp-tolerance-seconds: 300
    nonce-expire-seconds: 300
    admin-token: changeme-admin-token
  security:
    jwt-secret: cobasesys-jwt-secret-key-must-be-at-least-32-chars
    jwt-expiration-ms: 1800000
    refresh-expiration-ms: 604800000
    chain-secret: cobasesys-chain-secret-key-32chars!!
    balance-secret: cobasesys-balance-secret-32chars!
  invoice:
    api-url: https://api.xsdapi.com/v1/invoice
    app-key: changeme
    app-secret: changeme
    seller-name: "CoBaseSys"
    seller-tax-no: "91000000000000000X"
    default-tax-rate: 0.06
    rate-limit:
      max-per-day: 5
      min-interval-minutes: 30
  webhook:
    max-retry: 3
    retry-interval-seconds: 30
    timeout-seconds: 10
  notification:
    low-balance-threshold: 1000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cobasesys: DEBUG
    org.hibernate.SQL: DEBUG
